# Pebble preview app — indie-bookstore
# Per-project app; spawned + managed by the engine in the production design.
# This is the 2026-05-23 POC: hand-deployed to validate cold-start time,
# wake-on-traffic, and that next dev runs cleanly in a Fly Machine.

app = "pebble-preview-indie-bookstore"
primary_region = "ord"  # Chicago — low latency from US Eastern + Marc's location

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero. Machine auto-stops after 5 min idle (Fly default),
  # auto-starts within 2-10s when a request arrives. This is the whole
  # point of choosing Fly over Northflank/Render.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Cap concurrent connections per machine — keeps response times
  # snappy during a deploy or repair-loop file sync burst.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Minimal VM. next dev + Next.js 15 + Tailwind compile fits comfortably
# in 1GB. shared-cpu-1x is $0.0027/hr while running, $0 sleeping.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
