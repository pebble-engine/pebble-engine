<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pebble Engine v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========================================
   PEBBLE ENGINE v3.0 - CLEAN MODERN UI
======================================== */

:root {
  --bg: #ffffff;
  --surface: #f8f9fa;
  --border: #e5e7eb;
  --text: #111827;
  --text-soft: #6b7280;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --accent: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --recommended: #ecfdf5;
  --recommended-border: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ========================================
   HEADER
======================================== */

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
}

.header-content {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}

.version {
  font-size: 0.75rem;
  color: var(--text-soft);
  font-weight: 500;
  background: var(--bg);
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
}

/* ========================================
   MAIN CONTAINER
======================================== */

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem;
}

.step-indicator {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}

.step {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-soft);
  transition: all 0.2s;
}

.step.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.step.completed {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.step-divider {
  flex: 1;
  height: 2px;
  background: var(--border);
}

/* ========================================
   QUESTION CARD
======================================== */

.question-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2rem;
  margin-bottom: 2rem;
}

.question-header {
  margin-bottom: 1.5rem;
}

.question-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: var(--text);
}

.question-subtitle {
  font-size: 0.875rem;
  color: var(--text-soft);
}

/* ========================================
   INDUSTRY DETECTION BANNER
======================================== */

.industry-banner {
  background: var(--recommended);
  border: 1px solid var(--recommended-border);
  border-radius: 6px;
  padding: 1rem;
  margin-bottom: 1.5rem;
  display: none;
}

.industry-banner.show {
  display: block;
}

.industry-banner-title {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 0.25rem;
}

.industry-banner-text {
  font-size: 0.875rem;
  color: var(--text);
}

/* ========================================
   FORM INPUTS
======================================== */

.form-group {
  margin-bottom: 1.5rem;
}

label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.5rem;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
  font-family: inherit;
  transition: border-color 0.2s;
}

input[type="text"]:focus,
textarea:focus {
  outline: none;
  border-color: var(--primary);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

/* ========================================
   OPTION CARDS (SINGLE SELECT)
======================================== */

.options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
}

@media (min-width: 640px) {
  .options-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.option-card {
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
}

.option-card:hover {
  border-color: var(--primary);
  background: var(--surface);
}

.option-card.selected {
  border-color: var(--primary);
  background: #eff6ff;
}

.option-card.recommended {
  border-color: var(--recommended-border);
  background: var(--recommended);
}

.option-card.recommended .option-badge {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent);
  background: white;
  padding: 0.125rem 0.5rem;
  border-radius: 4px;
  margin-bottom: 0.5rem;
}

.option-badge {
  display: none;
}

.option-title {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.25rem;
  color: var(--text);
}

.option-description {
  font-size: 0.875rem;
  color: var(--text-soft);
  line-height: 1.5;
}

.option-explanation {
  font-size: 0.75rem;
  color: var(--accent);
  margin-top: 0.5rem;
  display: none;
}

.option-card.recommended .option-explanation {
  display: block;
}

/* ========================================
   MULTI-SELECT CHECKBOXES
======================================== */

.checkbox-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.75rem;
}

.checkbox-option {
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  background: white;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}

.checkbox-option:hover {
  border-color: var(--primary);
  background: var(--surface);
}

.checkbox-option.selected {
  border-color: var(--primary);
  background: #eff6ff;
}

.checkbox-option input[type="checkbox"] {
  margin-top: 0.125rem;
  width: 20px;
  height: 20px;
  cursor: pointer;
}

.checkbox-content {
  flex: 1;
}

.checkbox-title {
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.125rem;
}

.checkbox-description {
  font-size: 0.75rem;
  color: var(--text-soft);
}

/* ========================================
   BUTTONS
======================================== */

.button-group {
  display: flex;
  gap: 1rem;
  margin-top: 2rem;
}

button {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--border);
}

.btn-ghost {
  background: transparent;
  color: var(--text-soft);
}

.btn-ghost:hover {
  background: var(--surface);
}

/* ========================================
   LOADING & RESULTS
======================================== */

.loading-screen {
  text-align: center;
  padding: 4rem 2rem;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 1.5rem;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 0.5rem;
}

.loading-subtext {
  font-size: 0.875rem;
  color: var(--text-soft);
}

.results-screen {
  display: none;
}

.results-screen.show {
  display: block;
}

.results-header {
  background: var(--accent);
  color: white;
  padding: 2rem;
  border-radius: 8px;
  margin-bottom: 2rem;
  text-align: center;
}

.results-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.results-subtitle {
  font-size: 1rem;
  opacity: 0.9;
}

.prompt-box {
  background: #f9fafb;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 0.875rem;
  line-height: 1.6;
  max-height: 500px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
  margin-bottom: 1rem;
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo">Pebble Engine</div>
    <div class="version">v3.0</div>
  </div>
</header>

<main>
  <!-- STEP INDICATOR -->
  <div class="step-indicator" id="stepIndicator">
    <!-- Steps will be generated dynamically -->
  </div>

  <!-- QUESTION CONTAINER -->
  <div id="questionContainer">
    <!-- Questions will be rendered here -->
  </div>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen" class="hidden">
    <div class="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Generating Your Brief...</div>
      <div class="loading-subtext" id="loadingSubtext">Researching industry best practices...</div>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultsScreen" class="results-screen">
    <div class="results-header">
      <div class="results-title">✓ Brief Generated!</div>
      <div class="results-subtitle">Your custom website brief is ready</div>
    </div>
    <div class="button-group" style="justify-content: center; margin-bottom: 2rem;">
      <button class="btn-primary" onclick="copyPrompt()">Copy to Clipboard</button>
      <button class="btn-secondary" onclick="downloadPrompt()">Download</button>
      <button class="btn-ghost" onclick="location.reload()">Start Over</button>
    </div>
    <div class="prompt-box" id="promptBox"></div>
  </div>
</main>

<script>
// ========================================
// PEBBLE ENGINE v3.0 - SMART QUIZ
// ========================================

// INDUSTRY DATABASE
const INDUSTRIES = {
  'plumbing': {
    category: 'Home Services',
    recommendations: {
      target_audience: 'Homeowners',
      primary_goal: 'Call Now',
      brand_position: 'Professional & Established',
      brand_tone: 'Friendly & Approachable',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'Home service businesses convert best with light, approachable designs and prominent emergency CTAs.'
    }
  },
  'hvac': {
    category: 'Home Services',
    recommendations: {
      target_audience: 'Homeowners',
      primary_goal: 'Call Now',
      brand_position: 'Professional & Established',
      brand_tone: 'Friendly & Approachable',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'HVAC businesses need trustworthy, clean designs with clear emergency contact options.'
    }
  },
  'electrical': {
    category: 'Home Services',
    recommendations: {
      target_audience: 'Homeowners',
      primary_goal: 'Call Now',
      brand_position: 'Professional & Established',
      brand_tone: 'Friendly & Approachable',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'Electrical services require trust and immediate contact options for emergencies.'
    }
  },
  'restaurant': {
    category: 'Food & Hospitality',
    recommendations: {
      target_audience: 'Local Diners',
      primary_goal: 'View Menu',
      brand_position: 'Accessible & Community',
      brand_tone: 'Friendly & Inviting',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'Restaurants need appetizing food photography and easy access to menu and hours.'
    }
  },
  'cafe': {
    category: 'Food & Hospitality',
    recommendations: {
      target_audience: 'Local Consumers',
      primary_goal: 'View Menu',
      brand_position: 'Accessible & Community',
      brand_tone: 'Friendly & Inviting',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'Cafes succeed with warm, inviting designs and prominent menu display.'
    }
  },
  'lawyer': {
    category: 'Professional Services',
    recommendations: {
      target_audience: 'Individuals or Businesses',
      primary_goal: 'Schedule Consultation',
      brand_position: 'Professional & Established',
      brand_tone: 'Professional & Formal',
      visual_aesthetic: 'technical_professional',
      motion_intensity: 'minimal',
      explanation: 'Legal services need credible, structured designs with clear credentials.'
    }
  },
  'dentist': {
    category: 'Health & Wellness',
    recommendations: {
      target_audience: 'Local Individuals',
      primary_goal: 'Book Appointment',
      brand_position: 'Accessible & Community',
      brand_tone: 'Friendly & Warm',
      visual_aesthetic: 'minimal_refined',
      motion_intensity: 'minimal',
      explanation: 'Dental practices need calming, clean designs that reduce patient anxiety.'
    }
  },
  'yoga': {
    category: 'Health & Wellness',
    recommendations: {
      target_audience: 'Local Individuals',
      primary_goal: 'Book Appointment',
      brand_position: 'Accessible & Community',
      brand_tone: 'Friendly & Warm',
      visual_aesthetic: 'minimal_refined',
      motion_intensity: 'minimal',
      explanation: 'Wellness spaces need peaceful, uncluttered designs with soft colors.'
    }
  },
  'real-estate': {
    category: 'Real Estate',
    recommendations: {
      target_audience: 'Home Buyers',
      primary_goal: 'Browse Listings',
      brand_position: 'Professional & Trustworthy',
      brand_tone: 'Professional & Friendly',
      visual_aesthetic: 'clean_modern',
      motion_intensity: 'smooth',
      explanation: 'Real estate sites need clean, searchable layouts with excellent property photos.'
    }
  }
};

// QUIZ STATE
const state = {
  currentStep: 0,
  answers: {},
  detectedIndustry: null,
  recommendations: null
};

// QUESTION DEFINITIONS
const QUESTIONS = [
  {
    id: 'basics',
    type: 'text_multi',
    title: 'Tell us about your business',
    subtitle: 'Basic information to get started',
    fields: [
      { name: 'business_name', label: 'Business Name', placeholder: 'Vinny\'s Plumbing' },
      { name: 'business_type', label: 'Type of Business', placeholder: 'plumbing' },
      { name: 'location', label: 'Location / Service Area', placeholder: 'Suffolk County, NY' }
    ],
    onComplete: (answers) => {
      // Detect industry
      const businessType = answers.business_type.toLowerCase().trim();
      const detected = detectIndustry(businessType);
      if (detected) {
        state.detectedIndustry = detected.category;
        state.recommendations = detected.recommendations;
        showIndustryBanner(detected.category, detected.recommendations.explanation);
      }
    }
  },
  {
    id: 'target_audience',
    type: 'single_select',
    title: 'Who visits your site?',
    subtitle: 'Understanding your audience helps us recommend the right tone and complexity',
    options: [
      { value: 'homeowners', label: 'Homeowners', description: 'Residential property owners in your service area' },
      { value: 'businesses', label: 'Business Owners', description: 'Other businesses (B2B services)' },
      { value: 'consumers', label: 'Consumers', description: 'General public (B2C products/services)' },
      { value: 'individuals', label: 'Individuals', description: 'People seeking personal services' }
    ],
    getRecommended: () => state.recommendations?.target_audience
  },
  {
    id: 'primary_goal',
    type: 'single_select',
    title: 'What\'s the #1 action you want visitors to take?',
    subtitle: 'This determines CTA placement and hierarchy',
    options: [
      { value: 'call', label: 'Call Now', description: 'Emergency dispatch or immediate phone contact' },
      { value: 'book', label: 'Book Appointment', description: 'Schedule service or consultation' },
      { value: 'quote', label: 'Request Quote', description: 'Get pricing or proposal' },
      { value: 'browse', label: 'Browse Portfolio/Products', description: 'View work, listings, or products' },
      { value: 'purchase', label: 'Make Purchase', description: 'Buy products or services online' }
    ],
    getRecommended: () => state.recommendations?.primary_goal
  },
  {
    id: 'brand_position',
    type: 'single_select',
    title: 'How should your brand be positioned?',
    subtitle: 'This affects visual weight, pricing display, and overall aesthetic',
    options: [
      { value: 'premium', label: 'Premium / Luxury', description: 'High-end, exclusive, sophisticated' },
      { value: 'professional', label: 'Professional & Established', description: 'Trustworthy, credible, experienced' },
      { value: 'accessible', label: 'Accessible & Community', description: 'Approachable, welcoming, local' },
      { value: 'budget', label: 'Budget / Value', description: 'Affordable, no-frills, practical' }
    ],
    getRecommended: () => state.recommendations?.brand_position
  },
  {
    id: 'brand_tone',
    type: 'single_select',
    title: 'What tone should your copy have?',
    subtitle: 'This affects all text on the site - headlines, buttons, descriptions',
    options: [
      { value: 'professional_formal', label: 'Professional & Formal', description: 'Authoritative, serious, precise' },
      { value: 'friendly_approachable', label: 'Friendly & Approachable', description: 'Warm, conversational, human' },
      { value: 'technical_expert', label: 'Technical & Expert', description: 'Data-driven, specific, detailed' },
      { value: 'creative_confident', label: 'Creative & Confident', description: 'Bold, opinionated, distinctive' }
    ],
    getRecommended: () => state.recommendations?.brand_tone
  },
  {
    id: 'site_functions',
    type: 'multi_select',
    title: 'What does your site need to do?',
    subtitle: 'Select all that apply',
    options: [
      { value: 'booking', label: 'Online Booking', description: 'Clients schedule appointments' },
      { value: 'payment', label: 'Collect Payment', description: 'Deposits or full payment online' },
      { value: 'portfolio', label: 'Show Work / Gallery', description: 'Photos, case studies, projects' },
      { value: 'leads', label: 'Capture Leads', description: 'Contact form, quote request' },
      { value: 'ecommerce', label: 'Sell Products', description: 'Online store with checkout' },
      { value: 'presence', label: 'Just Be Findable', description: 'Hours, location, contact info' }
    ],
    getRecommended: () => {
      // Return array of recommended functions
      const type = state.answers.business_type?.toLowerCase();
      if (type?.includes('plumb') || type?.includes('hvac') || type?.includes('electric')) {
        return ['booking', 'leads', 'presence'];
      }
      return null;
    }
  },
  {
    id: 'integrations',
    type: 'conditional_text',
    title: 'Any existing systems to integrate?',
    subtitle: 'Leave blank if you don\'t have these yet',
    condition: () => {
      const fns = state.answers.site_functions || [];
      return fns.includes('booking') || fns.includes('payment') || fns.includes('ecommerce');
    },
    fields: [
      {
        name: 'booking_system',
        label: 'Booking System',
        placeholder: 'Housecall Pro, Calendly, etc.',
        show: () => (state.answers.site_functions || []).includes('booking')
      },
      {
        name: 'payment_system',
        label: 'Payment System',
        placeholder: 'Stripe, Square, etc.',
        show: () => (state.answers.site_functions || []).includes('payment') ||
                    (state.answers.site_functions || []).includes('ecommerce')
      }
    ]
  },
  {
    id: 'reference',
    type: 'text_multi',
    title: 'Visual inspiration (optional)',
    subtitle: 'Up to 3 reference sites — the engine synthesizes what they share',
    fields: [
      { name: 'reference_url',   label: 'Reference Website #1', placeholder: 'https://...', required: false },
      { name: 'reference_url_2', label: 'Reference Website #2', placeholder: 'https://...', required: false },
      { name: 'reference_url_3', label: 'Reference Website #3', placeholder: 'https://...', required: false },
      { name: 'extra_context', label: 'Additional Notes', placeholder: 'Any specific requests or context...', type: 'textarea', required: false }
    ]
  }
];

// UTILITY FUNCTIONS
function detectIndustry(businessType) {
  const type = businessType.toLowerCase().trim();

  // Direct matches
  if (INDUSTRIES[type]) {
    return INDUSTRIES[type];
  }

  // Fuzzy matches
  for (const [key, data] of Object.entries(INDUSTRIES)) {
    if (type.includes(key) || key.includes(type)) {
      return data;
    }
  }

  // Category matches
  const homeServices = ['pest', 'clean', 'landscape', 'roof', 'paint', 'locksmith', 'handyman'];
  if (homeServices.some(s => type.includes(s))) {
    return INDUSTRIES['plumbing']; // Use plumbing as template for home services
  }

  return null;
}

function showIndustryBanner(category, explanation) {
  const banner = document.createElement('div');
  banner.className = 'industry-banner show';
  banner.innerHTML = `
    <div class="industry-banner-title">✓ Detected: ${category}</div>
    <div class="industry-banner-text">${explanation}</div>
  `;

  // Insert after question header in next question
  setTimeout(() => {
    const questionCard = document.querySelector('.question-card');
    if (questionCard) {
      const header = questionCard.querySelector('.question-header');
      if (header) {
        header.after(banner);
      }
    }
  }, 100);
}

// RENDER FUNCTIONS
function renderStepIndicator() {
  const container = document.getElementById('stepIndicator');
  const totalSteps = QUESTIONS.length;

  let html = '';
  for (let i = 0; i < totalSteps; i++) {
    const status = i < state.currentStep ? 'completed' :
                   i === state.currentStep ? 'active' : '';
    html += `<div class="step ${status}">${i + 1}</div>`;
    if (i < totalSteps - 1) {
      html += '<div class="step-divider"></div>';
    }
  }

  container.innerHTML = html;
}

function renderQuestion(question) {
  const container = document.getElementById('questionContainer');

  let html = `
    <div class="question-card">
      <div class="question-header">
        <h2 class="question-title">${question.title}</h2>
        <p class="question-subtitle">${question.subtitle}</p>
      </div>
  `;

  // Render based on type
  if (question.type === 'text_multi') {
    question.fields.forEach(field => {
      if (field.show && !field.show()) return;

      const value = state.answers[field.name] || '';
      const inputType = field.type === 'textarea' ?
        `<textarea name="${field.name}" placeholder="${field.placeholder}">${value}</textarea>` :
        `<input type="text" name="${field.name}" placeholder="${field.placeholder}" value="${value}">`;

      html += `
        <div class="form-group">
          <label>${field.label}</label>
          ${inputType}
        </div>
      `;
    });
  }

  else if (question.type === 'single_select') {
    const recommended = question.getRecommended ? question.getRecommended() : null;

    html += '<div class="options-grid">';
    question.options.forEach(option => {
      const isRecommended = recommended &&
        (option.label === recommended || option.label.includes(recommended) || option.value === recommended.toLowerCase().replace(/ /g, '_'));
      const isSelected = state.answers[question.id] === option.value;

      html += `
        <div class="option-card ${isRecommended ? 'recommended' : ''} ${isSelected ? 'selected' : ''}"
             onclick="selectOption('${question.id}', '${option.value}')">
          ${isRecommended ? '<div class="option-badge">✓ Recommended</div>' : ''}
          <div class="option-title">${option.label}</div>
          <div class="option-description">${option.description}</div>
          ${isRecommended ? `<div class="option-explanation">Best for ${state.detectedIndustry}</div>` : ''}
        </div>
      `;
    });
    html += '</div>';
  }

  else if (question.type === 'multi_select') {
    const recommended = question.getRecommended ? question.getRecommended() : null;
    const selected = state.answers[question.id] || [];

    html += '<div class="checkbox-grid">';
    question.options.forEach(option => {
      const isRecommended = recommended && Array.isArray(recommended) && recommended.includes(option.value);
      const isSelected = selected.includes(option.value);

      html += `
        <label class="checkbox-option ${isSelected ? 'selected' : ''}">
          <input type="checkbox" value="${option.value}"
                 ${isSelected ? 'checked' : ''}
                 onchange="toggleCheckbox('${question.id}', '${option.value}')">
          <div class="checkbox-content">
            <div class="checkbox-title">${option.label} ${isRecommended ? '✓' : ''}</div>
            <div class="checkbox-description">${option.description}</div>
          </div>
        </label>
      `;
    });
    html += '</div>';
  }

  else if (question.type === 'conditional_text') {
    let hasVisibleFields = false;
    question.fields.forEach(field => {
      if (field.show && !field.show()) return;
      hasVisibleFields = true;

      const value = state.answers[field.name] || '';
      html += `
        <div class="form-group">
          <label>${field.label}</label>
          <input type="text" name="${field.name}" placeholder="${field.placeholder}" value="${value}">
        </div>
      `;
    });

    if (!hasVisibleFields) {
      // Skip this question
      nextStep();
      return;
    }
  }

  // Buttons
  html += `
    <div class="button-group">
      ${state.currentStep > 0 ? '<button class="btn-secondary" onclick="prevStep()">Back</button>' : ''}
      <button class="btn-primary" onclick="nextStep()">
        ${state.currentStep === QUESTIONS.length - 1 ? 'Generate Brief' : 'Continue'}
      </button>
    </div>
  </div>
  `;

  container.innerHTML = html;
}

// USER INTERACTION
function selectOption(questionId, value) {
  state.answers[questionId] = value;
  renderQuestion(QUESTIONS[state.currentStep]);
}

function toggleCheckbox(questionId, value) {
  if (!state.answers[questionId]) {
    state.answers[questionId] = [];
  }

  const index = state.answers[questionId].indexOf(value);
  if (index > -1) {
    state.answers[questionId].splice(index, 1);
  } else {
    state.answers[questionId].push(value);
  }
}

function nextStep() {
  const question = QUESTIONS[state.currentStep];

  // Collect answers from form fields
  const form = document.querySelector('.question-card');
  if (form) {
    const inputs = form.querySelectorAll('input[type="text"], textarea');
    inputs.forEach(input => {
      state.answers[input.name] = input.value;
    });
  }

  // Validate
  if (question.type === 'text_multi') {
    const requiredFields = question.fields.filter(f => f.required !== false && (!f.show || f.show()));
    const missing = requiredFields.find(f => !state.answers[f.name] || !state.answers[f.name].trim());
    if (missing) {
      alert(`Please fill in: ${missing.label}`);
      return;
    }
  }

  // Run onComplete callback
  if (question.onComplete) {
    question.onComplete(state.answers);
  }

  // Move to next step
  state.currentStep++;

  // Check if we're done
  if (state.currentStep >= QUESTIONS.length) {
    submitQuiz();
    return;
  }

  // Skip conditional questions that don't meet condition
  const nextQ = QUESTIONS[state.currentStep];
  if (nextQ.type === 'conditional_text' && nextQ.condition && !nextQ.condition()) {
    nextStep();
    return;
  }

  renderStepIndicator();
  renderQuestion(QUESTIONS[state.currentStep]);
  window.scrollTo(0, 0);
}

function prevStep() {
  if (state.currentStep > 0) {
    state.currentStep--;

    // Skip conditional questions going backwards too
    const prevQ = QUESTIONS[state.currentStep];
    if (prevQ.type === 'conditional_text' && prevQ.condition && !prevQ.condition()) {
      prevStep();
      return;
    }

    renderStepIndicator();
    renderQuestion(QUESTIONS[state.currentStep]);
    window.scrollTo(0, 0);
  }
}

// SUBMIT
async function submitQuiz() {
  // Show loading
  document.getElementById('questionContainer').classList.add('hidden');
  document.getElementById('stepIndicator').classList.add('hidden');
  document.getElementById('loadingScreen').classList.remove('hidden');

  // Map answers to API format
  const payload = {
    business_name: state.answers.business_name,
    business_type: state.answers.business_type,
    industry: state.answers.business_type,
    location: state.answers.location,
    brand_position: state.answers.brand_position || 'professional',
    brand_tone: state.answers.brand_tone || 'professional_formal',
    site_functions: state.answers.site_functions || [],
    booking_system: state.answers.booking_system || '',
    payment_system: state.answers.payment_system || '',
    reference_url: state.answers.reference_url || '',
    reference_url_2: state.answers.reference_url_2 || '',
    reference_url_3: state.answers.reference_url_3 || '',
    extra_context: state.answers.extra_context || '',
    visitor_action: (state.answers.site_functions || []).join('; ')
  };

  try {
    // Update loading text
    document.getElementById('loadingSubtext').textContent = 'Researching industry best practices...';

    const response = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'Failed to generate brief');
    }

    // Show results
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('resultsScreen').classList.add('show');
    document.getElementById('promptBox').textContent = data.prompt;

    // Store for copy/download
    window.generatedPrompt = data.prompt;

  } catch (error) {
    alert('Error generating brief: ' + error.message);
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('questionContainer').classList.remove('hidden');
    document.getElementById('stepIndicator').classList.remove('hidden');
  }
}

function mapToLegacyFormat(field) {
  // Map new quiz answers to old format expected by backend
  const mappings = {
    emotional_direction: {
      'professional_formal': 'Trusting and confident',
      'friendly_approachable': 'Calm and comfortable',
      'technical_expert': 'Trusting and confident',
      'creative_confident': 'Excited and inspired'
    },
    visual_experience: {
      'minimal': 'Smooth and professional',
      'smooth': 'Smooth and professional',
      'cinematic': 'Cinematic scrolling',
      'interactive': 'Interactive and playful'
    }
  };

  // Use motion_intensity for visual_experience
  if (field === 'visual_experience') {
    const motion = state.answers.motion_intensity;
    return mappings.visual_experience[motion] || 'Smooth and professional';
  }

  // Use brand_tone for emotional_direction
  if (field === 'emotional_direction') {
    const tone = state.answers.brand_tone;
    return mappings.emotional_direction[tone] || 'Trusting and confident';
  }

  return '';
}

// RESULTS ACTIONS
function copyPrompt() {
  if (!window.generatedPrompt) return;

  navigator.clipboard.writeText(window.generatedPrompt)
    .then(() => {
      alert('Prompt copied to clipboard!');
    })
    .catch(() => {
      // Clipboard API unavailable (e.g. non-HTTPS context) — surface the prompt box so the user can select-all and copy manually
      const box = document.getElementById('promptBox');
      if (box) {
        box.focus();
        window.getSelection()?.selectAllChildren(box);
      }
      alert('Could not copy automatically. Press Ctrl+A / Cmd+A in the prompt box to select all, then copy.');
    });
}

function downloadPrompt() {
  if (!window.generatedPrompt) return;

  const filename = (state.answers.business_name || 'brief').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-PROMPT.md';
  const blob = new Blob([window.generatedPrompt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// INIT
renderStepIndicator();
renderQuestion(QUESTIONS[0]);
</script>
