<style>
  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #131313;
    color: #e5e2e1;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  body { cursor: none; }
  @media (pointer: coarse) { body { cursor: auto; } }

  input, textarea, select { font-size: 16px; }

  .fraunces { font-family: 'Fraunces', serif; }
  .mono     { font-family: 'Geist Mono', monospace; }

  .aurora-mesh {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,218,243,0.18) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(216,185,255,0.12) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(0, 98,110,0.06) 0%, transparent 70%);
    filter: blur(80px);
    animation: aurora-drift 18s ease-in-out infinite alternate;
  }
  @keyframes aurora-drift {
    0%   { transform: translate3d(0,   0,   0) scale(1.0); }
    50%  { transform: translate3d(-3%, 2%,  0) scale(1.05); }
    100% { transform: translate3d(2%,  -2%, 0) scale(1.02); }
  }

  .glass-surface {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .glass-surface-active {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(156,240,255,0.4);
    box-shadow: inset 0 0 12px rgba(0,218,243,0.12), 0 0 24px rgba(0,218,243,0.08);
  }

  .custom-cursor {
    position: fixed; top: 0; left: 0;
    width: 20px; height: 20px;
    border: 1px solid rgba(156,240,255,0.6);
    background: rgba(156,240,255,0.08);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: difference;
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease;
    will-change: transform;
  }
  .custom-cursor.expanded {
    width: 44px; height: 44px;
    background: rgba(156,240,255,0.18);
    border-color: rgba(156,240,255,0.9);
  }

  /* Animated underline input — bottom border draws on focus */
  .input-underline {
    position: relative;
  }
  .input-underline input,
  .input-underline textarea {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    outline: none;
    padding: 16px 0;
    width: 100%;
    color: #e5e2e1;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    line-height: 28px;
    transition: border-color 0.3s ease;
  }
  .input-underline input::placeholder,
  .input-underline textarea::placeholder { color: rgba(255,255,255,0.25); }
  .input-underline::after {
    content: ""; position: absolute; bottom: 0; left: 0;
    width: 0; height: 1px;
    background: #00daf3;
    box-shadow: 0 -2px 12px rgba(0,218,243,0.5);
    transition: width 0.5s cubic-bezier(0.23,1,0.32,1);
  }
  .input-underline:focus-within::after { width: 100%; }

  /* Option card with hover slide bar */
  .option-card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }
  .option-card:hover { background: rgba(255,255,255,0.07); }
  .option-card .slide-bar {
    position: absolute; left: 0; bottom: 0;
    width: 0; height: 2px;
    background: #00daf3;
    box-shadow: 0 0 12px rgba(0,218,243,0.55);
    transition: width 0.4s cubic-bezier(0.23,1,0.32,1);
  }
  .option-card:hover .slide-bar { width: 100%; }
  .option-card.selected {
    background: rgba(255,255,255,0.08);
    border-color: rgba(156,240,255,0.45);
    box-shadow: inset 0 0 12px rgba(0,218,243,0.12);
  }
  .option-card.selected .slide-bar { width: 100%; }

  /* Magnetic continue button */
  .magnetic-cta {
    position: relative;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 16px 32px;
    border-radius: 9999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(156,240,255,0.45);
    color: #9cf0ff;
    font-weight: 700;
    font-size: 16px;
    backdrop-filter: blur(24px);
    cursor: none;
    transition: transform 0.18s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    will-change: transform;
  }
  .magnetic-cta:hover {
    background: rgba(156,240,255,0.12);
    border-color: #9cf0ff;
    box-shadow: 0 0 32px rgba(0,218,243,0.35);
  }
  .magnetic-cta:active { transform: scale(0.97); }
  .magnetic-cta:disabled { opacity: 0.4; cursor: not-allowed; }
  .magnetic-cta .arrow { transition: transform 0.3s ease; }
  .magnetic-cta:hover .arrow { transform: translateX(4px); }

  .ghost-btn {
    display: inline-flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.55);
    background: transparent; border: none;
    cursor: none;
    font-size: 14px;
    transition: color 0.25s ease;
  }
  .ghost-btn:hover { color: #e5e2e1; }

  /* Step entry animation — fade + slide up, word-by-word for headline */
  .step-wrap {
    animation: step-in 0.7s cubic-bezier(0.23,1,0.32,1) both;
  }
  @keyframes step-in {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .word-reveal > span {
    display: inline-block;
    opacity: 0;
    transform: translateY(60%);
    animation: word-rise 0.8s cubic-bezier(0.23,1,0.32,1) both;
  }
  @keyframes word-rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Step exit — slide up + fade */
  .step-leave {
    animation: step-out 0.4s cubic-bezier(0.55,0,0.66,0.55) forwards;
  }
  @keyframes step-out {
    to { opacity: 0; transform: translateY(-24px); }
  }

  /* Generating splash — video background + cyan ring + typed status */
  .splash {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    background: #131313;        /* fallback if video fails to load */
    overflow: hidden;
    opacity: 0;
    animation: splash-fade-in 0.6s ease-out forwards;
  }
  @keyframes splash-fade-in { to { opacity: 1; } }
  .splash-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .splash-overlay {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(19,19,19,0.0) 0%, rgba(19,19,19,0.55) 60%, rgba(19,19,19,0.85) 100%),
      linear-gradient(180deg, rgba(19,19,19,0.35) 0%, rgba(19,19,19,0.65) 100%);
    z-index: 1;
  }
  .splash .ring,
  .splash h2 { position: relative; z-index: 2; }
  .splash .ring {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #9cf0ff;
    box-shadow: 0 0 32px rgba(0,218,243,0.9);
    animation: splash-expand 2.4s ease-out infinite;
  }
  @keyframes splash-expand {
    0%   { transform: scale(1);  opacity: 1; }
    100% { transform: scale(22); opacity: 0; }
  }
  .splash h2 {
    margin-top: 80px;
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.4em;
    color: #9cf0ff;
    text-shadow: 0 0 24px rgba(0,218,243,0.6);
  }
  .splash h2 span { opacity: 0; animation: type-in 0.06s linear forwards; }

  @keyframes type-in { to { opacity: 1; } }

  /* Dashed dropzone */
  .dropzone {
    border: 1.5px dashed rgba(156,240,255,0.35);
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: #9cf0ff;
    background: rgba(156,240,255,0.06);
    transform: translateY(-2px);
  }

  /* Result code panel */
  .code-panel {
    max-height: 60vh;
    overflow: auto;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  .code-panel pre {
    margin: 0; padding: 20px 24px;
    color: rgba(229,226,225,0.85);
    white-space: pre-wrap; word-break: break-word;
  }
  .code-panel pre .h1 { color: #9cf0ff; font-weight: 700; }
  .code-panel pre .h2 { color: #d8b9ff; }
  .code-panel pre .em { color: #00daf3; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    user-select: none;
  }

  /* Industry detection banner */
  .industry-banner {
    border: 1px solid rgba(156,240,255,0.25);
    background: rgba(156,240,255,0.04);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
    animation: step-in 0.5s ease both;
  }

  /* Rotating ghost placeholder — fades between examples while the input is empty */
  .ghost-placeholder {
    position: absolute;
    top: 16px; left: 0;
    color: rgba(255,255,255,0.28);
    pointer-events: none;
    font-size: 18px;
    line-height: 28px;
    font-family: 'Inter', sans-serif;
    transition: opacity 0.28s ease;
    will-change: opacity;
  }
  .ghost-placeholder.hidden-by-value { opacity: 0 !important; }

  /* Continue success animation — 4 cyan squares snap together, anchored on the clicked button */
  .success-burst {
    position: fixed;
    /* top/left set inline based on the button's center */
    transform: translate(-50%, -50%);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s ease;
  }
  .success-burst.active { opacity: 1; }
  .success-burst.exit   { opacity: 0; }

  /* Pulse the button itself when clicked so the user feels the press */
  @keyframes cta-press {
    0%   { transform: scale(1); }
    35%  { transform: scale(0.94); box-shadow: 0 0 32px rgba(0,218,243,0.5); }
    100% { transform: scale(1); }
  }
  .magnetic-cta.pressing {
    animation: cta-press 0.45s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* Block grid — 4 cyan squares that fly in from corners and snap together */
  .burst-grid {
    position: relative;
    width: 96px;
    height: 96px;
  }
  .burst-block {
    position: absolute;
    width: 36px;
    height: 36px;
    background: #9cf0ff;
    border-radius: 6px;
    box-shadow: 0 0 28px rgba(0,218,243,0.85), inset 0 0 10px rgba(255,255,255,0.35);
    opacity: 0;
    will-change: transform, opacity;
  }
  .burst-tl { top: 0;    left: 0; }
  .burst-tr { top: 0;    right: 0; }
  .burst-bl { bottom: 0; left: 0; }
  .burst-br { bottom: 0; right: 0; }

  .success-burst.active .burst-tl { animation: burst-fly-tl 0.65s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .success-burst.active .burst-tr { animation: burst-fly-tr 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.06s forwards; }
  .success-burst.active .burst-bl { animation: burst-fly-bl 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.12s forwards; }
  .success-burst.active .burst-br { animation: burst-fly-br 0.65s cubic-bezier(0.34,1.56,0.64,1) 0.18s forwards; }

  @keyframes burst-fly-tl {
    0%   { transform: translate(-70px, -70px) scale(0.4) rotate(-25deg); opacity: 0; }
    60%  { opacity: 1; }
    80%  { transform: translate(4px, 4px)     scale(1.08) rotate(0deg);  opacity: 1; }
    100% { transform: translate(0, 0)         scale(1)    rotate(0deg);  opacity: 1; }
  }
  @keyframes burst-fly-tr {
    0%   { transform: translate(70px, -70px)  scale(0.4) rotate(25deg);  opacity: 0; }
    60%  { opacity: 1; }
    80%  { transform: translate(-4px, 4px)    scale(1.08) rotate(0deg);  opacity: 1; }
    100% { transform: translate(0, 0)         scale(1)    rotate(0deg);  opacity: 1; }
  }
  @keyframes burst-fly-bl {
    0%   { transform: translate(-70px, 70px)  scale(0.4) rotate(25deg);  opacity: 0; }
    60%  { opacity: 1; }
    80%  { transform: translate(4px, -4px)    scale(1.08) rotate(0deg);  opacity: 1; }
    100% { transform: translate(0, 0)         scale(1)    rotate(0deg);  opacity: 1; }
  }
  @keyframes burst-fly-br {
    0%   { transform: translate(70px, 70px)   scale(0.4) rotate(-25deg); opacity: 0; }
    60%  { opacity: 1; }
    80%  { transform: translate(-4px, -4px)   scale(1.08) rotate(0deg);  opacity: 1; }
    100% { transform: translate(0, 0)         scale(1)    rotate(0deg);  opacity: 1; }
  }

  /* Pulsing ring behind the blocks */
  .burst-ring {
    position: absolute;
    inset: -12px;
    border: 1px solid #9cf0ff;
    border-radius: 50%;
    opacity: 0;
  }
  .success-burst.active .burst-ring {
    animation: burst-ring 0.7s ease-out 0.35s forwards;
  }
  @keyframes burst-ring {
    0%   { transform: scale(0.6); opacity: 0.9; }
    100% { transform: scale(2.4); opacity: 0; }
  }

  .burst-status {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.45em;
    color: #9cf0ff;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(0,218,243,0.7);
  }
  .burst-status span { display: inline-block; opacity: 0; transform: translateY(8px); }
  .success-burst.active .burst-status span {
    animation: status-letter 0.4s ease forwards;
  }
  @keyframes status-letter {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Click ripple — fires immediately on Continue click for tactile feedback */
  .click-ripple {
    position: fixed;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(156,240,255,0.45);
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 199;
    animation: ripple-expand 0.6s ease-out forwards;
  }
  @keyframes ripple-expand {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0.7; }
    100% { transform: translate(-50%, -50%) scale(8);   opacity: 0;   }
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
    .aurora-mesh { animation: none; }
    body { cursor: auto; }
    .custom-cursor { display: none !important; }
  }
</style>
</head>

const QUESTIONS = [

/* ---------- helpers ---------- */
function detectIndustry(type) {
  if (!type) return null;
  if (INDUSTRIES[type]) return INDUSTRIES[type];
  for (const [k, v] of Object.entries(INDUSTRIES)) {
    if (type.includes(k) || k.includes(type)) return v;
  }
  return null;
}

function setProgress(stepIdx) {
  const total = QUESTIONS.length;
  const pct = ((stepIdx + 1) / total) * 100;
  document.getElementById('topProgress').style.width = `${pct}%`;
  document.getElementById('progressFill').style.height = `${pct}%`;
  document.getElementById('stepCounter').textContent = `${String(stepIdx + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
}

function wordRevealHTML(text) {
  return text.split(/(\s+)/).map((word, i) => {
    if (/^\s+$/.test(word)) return word;
    const delay = (i * 0.06).toFixed(2);
    return `<span style="animation-delay: ${delay}s">${word}</span>`;
  }).join('');
}

/* ---------- renderers ---------- */
function renderQuestion(question) {
  const container = document.getElementById('questionContainer');

  // Industry detection banner (only after basics step submits)
  const showBanner = state.detectedIndustry && question.id !== 'basics';
  const bannerHTML = showBanner ? `
    <div class="industry-banner mb-stack-md">
      <span class="material-symbols-outlined text-primary-fixed text-[20px]">check_circle</span>
      <div>
        <p class="mono text-[10px] uppercase tracking-[0.2em] text-primary-fixed">Industry locked · ${state.detectedIndustry.category}</p>
        <p class="text-body-md text-on-surface-variant mt-0.5">${state.detectedIndustry.explanation}</p>
      </div>
    </div>` : '';

  const eyebrowHTML = `
    <div class="inline-flex items-center gap-2 mb-stack-md">
      <div class="w-1 h-1 rounded-full bg-primary-fixed-dim"></div>
      <span class="mono text-label-mono text-primary-fixed uppercase tracking-[0.3em]">${question.eyebrow}</span>
    </div>`;

  let bodyHTML = '';

  if (question.type === 'text_multi') {
    bodyHTML = question.fields.map(field => {
      const value = state.answers[field.name] || '';
      const usesRotation = Array.isArray(field.placeholders) && field.placeholders.length > 1;
      const firstPlaceholder = usesRotation ? field.placeholders[0] : (field.placeholder || '');
      const ghostHTML = usesRotation
        ? `<span class="ghost-placeholder ${value ? 'hidden-by-value' : ''}" data-ghost-for="${field.name}">${firstPlaceholder}</span>`
        : '';
      const placeholderAttr = usesRotation ? '' : firstPlaceholder;
      const inputEl = field.type === 'textarea'
        ? `<textarea rows="3" name="${field.name}" placeholder="${placeholderAttr}">${value}</textarea>`
        : `<input type="text" name="${field.name}" placeholder="${placeholderAttr}" value="${value}" autocomplete="off" />`;
      return `
        <div class="group">
          <label class="mono text-label-mono text-on-surface-variant/70 uppercase tracking-[0.2em] block mb-1">${field.label}</label>
          <div class="input-underline">${inputEl}${ghostHTML}</div>

    }).join('');

  else if (question.type === 'single_select') {
    bodyHTML = `<div class="grid grid-cols-1 gap-stack-md" data-options-for="${question.id}">` + question.options.map(opt => {
      const selected = state.answers[question.id] === opt.value;

        <button type="button"

                class="glass-surface option-card ${selected ? 'selected' : ''} rounded-xl p-6 text-left">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1">
              ${opt.eyebrow ? `<span class="mono text-label-mono text-primary-fixed uppercase tracking-[0.2em] block mb-2">${opt.eyebrow}</span>` : ''}
              <h3 class="fraunces text-headline-lg text-on-surface mb-2">${opt.label}</h3>
              <p class="text-body-md text-on-surface-variant max-w-[480px]">${opt.description}</p>
            </div>
            <span class="material-symbols-outlined text-primary-fixed/60 text-[28px]">${opt.icon || 'arrow_outward'}</span>
          </div>
          <div class="slide-bar"></div>
        </button>`;
    }).join('') + `</div>`;
  }

  else if (question.type === 'design_upload') {
    const figmaValue = state.answers.figma_url || '';
    const imgCount = (state.answers.design_reference_images || []).length;
    const figmaField = question.fields.find(f => f.name === 'figma_url');
    const figmaRotates = figmaField && Array.isArray(figmaField.placeholders) && figmaField.placeholders.length > 1;
    const figmaFirst = figmaRotates ? figmaField.placeholders[0] : "https://figma.com/design/...";
    const figmaGhost = figmaRotates
      ? `<span class="ghost-placeholder ${figmaValue ? 'hidden-by-value' : ''}" data-ghost-for="figma_url">${figmaFirst}</span>`
      : '';
    bodyHTML = `
      <div class="space-y-stack-md">
        <div>
          <label class="mono text-label-mono text-on-surface-variant/70 uppercase tracking-[0.2em] block mb-1">Figma URL</label>
          <div class="input-underline">
            <input type="text" name="figma_url" placeholder="${figmaRotates ? '' : figmaFirst}" value="${figmaValue}" autocomplete="off" />
            ${figmaGhost}
          </div>
        </div>
        <div id="dropzone" class="dropzone glass-surface rounded-xl p-8 flex flex-col items-center text-center cursor-pointer">
          <div class="w-12 h-12 rounded-full bg-primary-fixed/10 flex items-center justify-center mb-3 transition-transform group-hover:scale-110">
            <span class="material-symbols-outlined text-primary-fixed text-[24px]">cloud_upload</span>

          <p id="uploadStatus" class="mono text-label-mono text-primary-fixed mt-3 ${imgCount ? '' : 'opacity-0'}">${imgCount} image${imgCount === 1 ? '' : 's'} attached</p>
          <input id="fileInput" type="file" accept="image/*" multiple class="hidden" onchange="handleDesignUpload(event)" />
        </div>
      </div>`;
  }

  const isLast = state.currentStep === QUESTIONS.length - 1;
  const backHTML = state.currentStep > 0
    ? `<button type="button" class="ghost-btn" onclick="prevStep()"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Back</button>`
    : `<span></span>`;

  const continueHTML = `
    <button type="button" class="magnetic-cta" id="continueBtn" onclick="nextStep(event)">
      ${isLast ? 'Generate Brief' : 'Continue'}
      <span class="material-symbols-outlined arrow">arrow_forward</span>
    </button>`;

  container.innerHTML = `
    <article class="step-wrap">
      ${bannerHTML}
      ${eyebrowHTML}
      <h1 class="fraunces text-display-xl-mobile md:text-display-xl text-on-surface mb-stack-sm word-reveal">${wordRevealHTML(question.title)}</h1>
      <p class="text-body-lg text-on-surface-variant max-w-[540px] mb-stack-lg">${question.subtitle}</p>
      <section class="space-y-stack-lg">
        ${bodyHTML}
        <div class="flex items-center justify-between pt-stack-md">
          ${backHTML}
          ${continueHTML}
        </div>

    </article>`;

  // Wire the dropzone click → hidden file input
  const dz = document.getElementById('dropzone');
  if (dz) {
    const fileInput = document.getElementById('fileInput');
    dz.addEventListener('click', () => fileInput && fileInput.click());
    ['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drag-over'); }));
    ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove('drag-over')));
    dz.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files.length) {
        const fakeEvent = { target: { files: e.dataTransfer.files } };
        handleDesignUpload(fakeEvent);
      }
    });
  }

  attachCursorListeners();
  startPlaceholderRotations(question);
}

/* ---------- rotating placeholders ---------- */
const ROTATION_INTERVAL_MS = 2400;
const ROTATION_FADE_MS = 280;
let activeRotations = [];

function stopAllPlaceholderRotations() {
  activeRotations.forEach(id => clearInterval(id));
  activeRotations = [];
}

function startPlaceholderRotations(question) {
  stopAllPlaceholderRotations();
  const fields = question.fields || [];
  fields.forEach(field => {
    if (!Array.isArray(field.placeholders) || field.placeholders.length < 2) return;
    const ghost = document.querySelector(`[data-ghost-for="${field.name}"]`);
    const input = document.querySelector(`#questionContainer [name="${field.name}"]`);
    if (!ghost || !input) return;

    // Hide ghost the moment user types or focuses
    const syncGhostVisibility = () => {
      if (input.value || document.activeElement === input) {
        ghost.classList.add('hidden-by-value');
      } else {
        ghost.classList.remove('hidden-by-value');
      }
    };
    input.addEventListener('input', syncGhostVisibility);
    input.addEventListener('focus', syncGhostVisibility);
    input.addEventListener('blur',  syncGhostVisibility);

    let idx = 0;
    const tick = () => {
      // Pause rotation when the user is engaged with the field
      if (input.value || document.activeElement === input) return;
      ghost.style.opacity = '0';
      setTimeout(() => {
        idx = (idx + 1) % field.placeholders.length;
        ghost.textContent = field.placeholders[idx];
        ghost.style.opacity = '';
      }, ROTATION_FADE_MS);
    };
    const id = setInterval(tick, ROTATION_INTERVAL_MS);
    activeRotations.push(id);
  });
}

/* ---------- success burst ("200 OK" animation on Continue) ---------- */
function spawnClickRipple(x, y) {
  const r = document.createElement('div');
  r.className = 'click-ripple';
  r.style.left = x + 'px';
  r.style.top  = y + 'px';
  document.body.appendChild(r);
  setTimeout(() => r.remove(), 650);
}

function playSuccessBurst(done, btn) {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { done(); return; }

  // Anchor the burst on the clicked button — feels like the button popped
  let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  if (btn && btn.getBoundingClientRect) {
    const r = btn.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top  + r.height / 2;
    btn.classList.add('pressing');
    setTimeout(() => btn.classList.remove('pressing'), 460);
  }
  // Immediate click ripple at button center so the feedback is instant
  spawnClickRipple(cx, cy);

  const overlay = document.createElement('div');
  overlay.className = 'success-burst';
  overlay.style.left = cx + 'px';
  overlay.style.top  = (cy - 80) + 'px'; // float slightly above the button
  overlay.innerHTML = `
    <div class="burst-grid">
      <div class="burst-ring"></div>
      <div class="burst-block burst-tl"></div>
      <div class="burst-block burst-tr"></div>
      <div class="burst-block burst-bl"></div>
      <div class="burst-block burst-br"></div>
    </div>
    <div class="burst-status">
      <span style="animation-delay: 0.55s">2</span><span style="animation-delay: 0.62s">0</span><span style="animation-delay: 0.69s">0</span><span style="animation-delay: 0.80s">&nbsp;&nbsp;</span><span style="animation-delay: 0.87s">O</span><span style="animation-delay: 0.94s">K</span>
    </div>
  `;
  document.body.appendChild(overlay);
  // Use requestAnimationFrame so the initial opacity:0 paints before .active fires
  requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('active')));

  setTimeout(() => {
    overlay.classList.add('exit');
    setTimeout(() => overlay.remove(), 220);
    done();
  }, 760);
}

/* ---------- interactions ---------- */
function selectOption(questionId, value) {
  state.answers[questionId] = value;
  // Toggle .selected class on the right card — DO NOT re-render the whole question.
  // Re-rendering re-fires the headline word-reveal and feels like a page refresh.
  const cards = document.querySelectorAll(`.option-card[data-q="${questionId}"]`);
  cards.forEach(el => {
    el.classList.toggle('selected', el.dataset.value === value);
  });
}

async function handleDesignUpload(event) {
  const files = Array.from(event.target.files || []);
  if (files.length === 0) return;
  const status = document.getElementById('uploadStatus');
  if (status) { status.classList.remove('opacity-0'); status.textContent = `Encoding ${files.length} image${files.length === 1 ? '' : 's'}...`; }
  const encoded = await Promise.all(files.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const commaIdx = result.indexOf(',');
      resolve({
        media_type: file.type || 'image/png',
        data: commaIdx > -1 ? result.slice(commaIdx + 1) : result,
        filename: file.name,
        size: file.size,
      });
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  })));
  state.answers.design_reference_images = encoded;
  if (status) status.textContent = `${encoded.length} image${encoded.length === 1 ? '' : 's'} attached`;
}

function collectStepInputs() {
  const inputs = document.querySelectorAll('#questionContainer input[type="text"], #questionContainer input[type="tel"], #questionContainer input[type="email"], #questionContainer textarea');
  inputs.forEach(input => { state.answers[input.name] = input.value; });
}

function transitionOut(then) {
  const wrap = document.querySelector('.step-wrap');
  if (!wrap) return then();
  wrap.classList.add('step-leave');
  setTimeout(then, 380);
}

function nextStep(evt) {
  collectStepInputs();
  const q = QUESTIONS[state.currentStep];
  if (q.type === 'text_multi') {
    const required = q.fields.filter(f => f.required !== false);
    const missing = required.find(f => !(state.answers[f.name] || '').trim());
    if (missing) {
      const inputEl = document.querySelector(`#questionContainer [name="${missing.name}"]`);
      if (inputEl) inputEl.focus();
      flashFieldError(missing.label);
      return;
    }
  }
  if (q.onComplete) q.onComplete();

  stopAllPlaceholderRotations();

  // Anchor the burst on the actual Continue button (mouse OR keyboard)
  const btn = (evt && evt.currentTarget && evt.currentTarget.classList?.contains('magnetic-cta'))
    ? evt.currentTarget
    : document.getElementById('continueBtn');

  playSuccessBurst(() => {
    transitionOut(() => {
      state.currentStep++;
      if (state.currentStep >= QUESTIONS.length) {
        submitQuiz();
        return;
      }
      setProgress(state.currentStep);
      renderQuestion(QUESTIONS[state.currentStep]);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }, btn);
}

/* ---------- keyboard: Enter advances to next step ---------- */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  // Allow Enter inside textarea (new line) and during loading/results
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea') return;
  if (document.getElementById('loadingScreen').classList.contains('hidden') === false) return;
  if (document.getElementById('resultsScreen').classList.contains('hidden') === false) return;
  // Prevent the default form-submit (we're not in a form, but be safe)
  e.preventDefault();
  nextStep();
});

function prevStep() {
  if (state.currentStep === 0) return;
  collectStepInputs();
  transitionOut(() => {
    state.currentStep--;
    setProgress(state.currentStep);
    renderQuestion(QUESTIONS[state.currentStep]);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

function flashFieldError(label) {
  // Lightweight inline alert — replaces blocking alert()
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-[120] mono text-label-mono uppercase tracking-widest bg-error/20 text-error border border-error/40 rounded-full px-4 py-2';
    document.body.appendChild(toast);
  }
  toast.textContent = `Required · ${label}`;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.transition = 'opacity 0.4s'; toast.style.opacity = '0'; }, 1800);
}

/* ---------- submission + splash + results ---------- */
async function submitQuiz() {
  showSplash();
  const payload = {
    business_name:           state.answers.business_name || '',
    business_type:           state.answers.business_type || '',
    industry:                state.answers.business_type || '',
    location:                state.answers.location || '',
    services_offered:        state.answers.services_offered || '',
    phone:                   state.answers.phone || '',
    email:                   state.answers.email || '',
    address:                 state.answers.address || '',
    brand_position:          'professional',
    brand_tone:              state.answers.tone || 'professional_formal',
    site_functions:          [],
    booking_system:          '',
    payment_system:          '',
    figma_url:               state.answers.figma_url || '',
    design_reference_images: state.answers.design_reference_images || [],
    reference_url:   '',
    reference_url_2: '',
    reference_url_3: '',
    extra_context:           state.answers.services_offered || '',
    visitor_action:          'general business presence',
    output_mode:             state.answers.output_mode || 'full',
  };
  try {
    const response = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Failed to generate brief');
    hideSplash();
    showResults(data);
  } catch (err) {
    hideSplash();
    flashFieldError(err.message || 'Build failed');
    state.currentStep = QUESTIONS.length - 1;
    setProgress(state.currentStep);
    renderQuestion(QUESTIONS[state.currentStep]);
  }
}

function showSplash() {
  document.getElementById('questionContainer').classList.add('hidden');
  const splash = document.getElementById('loadingScreen');
  splash.classList.remove('hidden');

  // Kick the video — Chrome pauses autoplay while the parent is display:none,
  // and some browsers need an explicit play() after the element becomes visible.
  const vid = splash.querySelector('.splash-video');
  if (vid) {
    vid.currentTime = 0;
    const p = vid.play();
    if (p && typeof p.catch === 'function') p.catch(() => { /* autoplay blocked — silent */ });
  }

  const text = 'GENERATING BRIEF';
  const splashText = document.getElementById('splashText');
  splashText.innerHTML = text.split('').map((c, i) => `<span style="animation-delay: ${(i * 0.05).toFixed(2)}s">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
}

function hideSplash() {
  document.getElementById('loadingScreen').classList.add('hidden');
}

function highlightMarkdown(md) {
  return md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^(# .+)$/gm,  '<span class="h1">$1</span>')
    .replace(/^(## .+)$/gm, '<span class="h2">$1</span>')
    .replace(/`([^`]+)`/g,  '<span class="em">`$1`</span>');
}

function showResults(data) {
  window.generatedPrompt = data.prompt;
  document.getElementById('questionContainer').classList.add('hidden');
  const screen = document.getElementById('resultsScreen');
  screen.classList.remove('hidden');
  const meta = [];
  meta.push(`<span><span class="text-on-surface-variant/60">PROMPT:</span> <span class="text-primary-fixed">${(data.prompt || '').length.toLocaleString()} chars</span></span>`);
  if (data.industry_intel_key) meta.push(`<span><span class="text-on-surface-variant/60">INDUSTRY:</span> <span class="text-primary-fixed">${data.industry_intel_key}</span></span>`);
  meta.push(`<span><span class="text-on-surface-variant/60">SAVED:</span> <span class="text-primary-fixed">${data.saved_to}</span></span>`);
  if (typeof data.warning_count === 'number') meta.push(`<span><span class="text-on-surface-variant/60">WARNINGS:</span> <span class="text-primary-fixed">${data.warning_count}</span></span>`);

  screen.innerHTML = `
    <article class="step-wrap">
      <div class="flex items-center gap-4 mb-stack-md">
        <div class="w-12 h-12 rounded-full border border-primary-fixed/40 flex items-center justify-center bg-primary-fixed/5 shadow-[0_0_24px_rgba(0,218,243,0.2)]">
          <span class="material-symbols-outlined text-primary-fixed text-[28px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
        <h1 class="fraunces text-display-xl-mobile md:text-display-xl text-on-surface leading-tight">Prompt Generated</h1>
      </div>
      <div class="flex flex-wrap gap-x-6 gap-y-2 py-4 border-y border-white/5 mb-stack-md mono text-label-mono uppercase tracking-widest">
        ${meta.join('')}
      </div>
      <div class="code-panel mb-stack-md">
        <pre id="promptPre"></pre>
      </div>
      <div class="flex flex-wrap gap-stack-sm">
        <button class="magnetic-cta" onclick="copyPrompt()"><span class="material-symbols-outlined">content_copy</span>Copy to Clipboard</button>
        <button class="magnetic-cta" onclick="downloadPrompt()"><span class="material-symbols-outlined">download</span>Download .md</button>
        <button class="ghost-btn" onclick="location.reload()"><span class="material-symbols-outlined text-[18px]">refresh</span>Start Over</button>
      </div>
    </article>`;

  document.getElementById('promptPre').innerHTML = highlightMarkdown(data.prompt || '');
  attachCursorListeners();
}

function copyPrompt() {
  if (!window.generatedPrompt) return;
  navigator.clipboard.writeText(window.generatedPrompt).then(() => {
    flashFieldError('Copied to clipboard');
  }).catch(() => {
    const pre = document.getElementById('promptPre');
    if (pre) { pre.focus(); window.getSelection()?.selectAllChildren(pre); }
    flashFieldError('Press Ctrl+C to copy manually');
  });
}

function downloadPrompt() {
  if (!window.generatedPrompt) return;
  const filename = (state.answers.business_name || 'brief').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-PROMPT.md';
  const blob = new Blob([window.generatedPrompt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------- custom cursor + magnetic effect ---------- */
const cursor = document.getElementById('cursor');
let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
});

function cursorRAF() {
  // Subtle lag for the dot (80ms-ish)
  cursorX += (mouseX - cursorX) * 0.22;
  cursorY += (mouseY - cursorY) * 0.22;
  if (cursor) cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) translate(-50%, -50%)`;
  requestAnimationFrame(cursorRAF);
}
cursorRAF();

function attachCursorListeners() {
  document.querySelectorAll('button, a, input, textarea, .option-card, .dropzone').forEach(el => {
    if (el._cursorBound) return;
    el._cursorBound = true;
    el.addEventListener('mouseenter', () => cursor && cursor.classList.add('expanded'));
    el.addEventListener('mouseleave', () => cursor && cursor.classList.remove('expanded'));
  });

  // Magnetic effect for CTA buttons
  document.querySelectorAll('.magnetic-cta').forEach(btn => {
    if (btn._magBound) return;
    btn._magBound = true;
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      btn.style.transform = `translate(${x * 0.18}px, ${y * 0.18}px)`;
    });
    btn.addEventListener('mouseleave', () => { btn.style.transform = 'translate(0,0)'; });
  });
}

/* ---------- init ---------- */
setProgress(0);
renderQuestion(QUESTIONS[0]);
</script>
