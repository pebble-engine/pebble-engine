<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pebble — Your Site Is Live</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#344d32", "on-tertiary-fixed-variant": "#663d1e",
                        "on-primary": "#ffffff", "primary-fixed": "#b7ebf9", "surface-container-highest": "#e2e2e3",
                        "on-error": "#ffffff", "error-container": "#ffdad6", "secondary-fixed-dim": "#b1ceac",
                        "surface-tint": "#326571", "inverse-primary": "#9bcfdc", "tertiary-container": "#8b5c3a",
                        "tertiary": "#6f4525", "on-secondary": "#ffffff", "on-background": "#191c1d",
                        "secondary-container": "#cdebc6", "surface": "#f9f9fa", "surface-dim": "#d9dadb",
                        "secondary": "#4b6548", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#154d59",
                        "on-surface": "#191c1d", "surface-container-high": "#e7e8e9", "on-surface-variant": "#40484a",
                        "background": "#f9f9fa", "on-tertiary": "#ffffff", "on-tertiary-container": "#ffe0cd",
                        "primary-fixed-dim": "#9bcfdc", "inverse-on-surface": "#f0f1f1", "error": "#ba1a1a",
                        "primary": "#205661", "surface-variant": "#e2e2e3", "on-secondary-container": "#516b4e",
                        "on-secondary-fixed": "#08200a", "surface-container": "#edeeee", "secondary-fixed": "#cdebc6",
                        "on-error-container": "#93000a", "surface-bright": "#f9f9fa", "on-primary-fixed": "#001f26",
                        "tertiary-fixed": "#ffdcc6", "outline": "#70787b", "inverse-surface": "#2e3132",
                        "tertiary-fixed-dim": "#f6ba91", "on-tertiary-fixed": "#301400", "primary-container": "#3b6e7a",
                        "on-primary-container": "#bbeffc", "surface-container-low": "#f3f4f4", "outline-variant": "#c0c8ca",
                        "sand": "#F7F3EC", "stone": "#ECE6DC", "mist": "#EFEAE1", "pebble": "#D8D1C5",
                        "river": "#205661", "charcoal": "#191c1d"
                    },
                    "borderRadius": {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    "spacing": {"gutter": "24px", "margin-desktop": "64px", "md": "16px", "xs": "4px", "sm": "8px", "lg": "24px", "xl": "32px", "margin-mobile": "16px"},
                    "fontFamily": {"body-lg": ["Inter"], "display-lg": ["Literata"], "mono-sm": ["JetBrains Mono"], "headline-lg": ["Literata"], "label-md": ["Inter"], "body-md": ["Inter"], "display-md": ["Literata"]},
                    "fontSize": {
                        "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "mono-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-md": ["36px", {"lineHeight": "1.2", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { background-color: #F7F3EC; color: #191c1d; }
    </style>
</head>
<body class="font-body-md text-body-md antialiased min-h-screen">
<header class="flex justify-between items-center px-margin-desktop w-full h-16 bg-surface border-b border-outline-variant fixed top-0 z-50">
<div class="font-display-md text-display-md text-primary tracking-tight">Pebble</div>
<div class="flex items-center gap-md">
<span class="text-primary font-body-md text-body-md">Comfort View</span>
<span class="material-symbols-outlined text-primary cursor-pointer">help</span>
</div>
</header>
<main class="mt-16 p-margin-desktop min-h-[calc(100vh-64px)] flex flex-col items-center justify-center">
<div class="mb-xl text-primary animate-pulse">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">water_drop</span>
</div>
<div class="max-w-2xl w-full text-center space-y-xl">
<h1 class="font-display-lg text-display-lg text-charcoal">Your website is live.</h1>
<div class="bg-stone border border-pebble rounded-xl p-xl shadow-sm space-y-lg">
<div class="flex flex-col items-center">
<div class="bg-mist border border-pebble rounded-lg px-xl py-md mb-md">
<span id="published-url" class="font-mono-sm text-body-lg tracking-tight text-primary">your-site.pebble.site</span>
</div>
<p class="text-outline font-label-md text-label-md uppercase tracking-widest">URL active</p>
</div>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-md pt-lg border-t border-pebble">
<button id="publish-share" class="flex flex-col items-center justify-center gap-sm p-md rounded-lg hover:bg-mist transition-all group">
<div class="w-12 h-12 rounded-full bg-river text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">share</span>
</div>
<span class="font-label-md text-charcoal">Share</span>
</button>
<button id="publish-view" class="flex flex-col items-center justify-center gap-sm p-md rounded-lg hover:bg-mist transition-all group">
<div class="w-12 h-12 rounded-full bg-river text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">visibility</span>
</div>
<span class="font-label-md text-charcoal">View as visitor</span>
</button>
<button id="publish-edit" class="flex flex-col items-center justify-center gap-sm p-md rounded-lg hover:bg-mist transition-all group">
<div class="w-12 h-12 rounded-full bg-river text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined">edit</span>
</div>
<span class="font-label-md text-charcoal">Keep editing</span>
</button>
</div>
</div>
<div class="flex flex-col items-center gap-sm">
<p class="text-outline font-body-md">Everything is editable later. You don't have to be done.</p>
</div>
</div>
</main>
<script src="/v2/app.js"></script>
</body></html>
