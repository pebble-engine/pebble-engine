<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pebble — Workspace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Literata:wght@600;700&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#344d32", "on-tertiary-fixed-variant": "#663d1e",
                        "on-primary": "#ffffff", "primary-fixed": "#b7ebf9", "surface-container-highest": "#e2e2e3",
                        "on-error": "#ffffff", "error-container": "#ffdad6", "secondary-fixed-dim": "#b1ceac",
                        "surface-tint": "#326571", "inverse-primary": "#9bcfdc", "tertiary-container": "#8b5c3a",
                        "tertiary": "#6f4525", "on-secondary": "#ffffff", "on-background": "#191c1d",
                        "secondary-container": "#cdebc6", "surface": "#f9f9fa", "surface-dim": "#d9dadb",
                        "secondary": "#4b6548", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#154d59",
                        "on-surface": "#191c1d", "surface-container-high": "#e7e8e9", "on-surface-variant": "#40484a",
                        "background": "#f9f9fa", "on-tertiary": "#ffffff", "on-tertiary-container": "#ffe0cd",
                        "primary-fixed-dim": "#9bcfdc", "inverse-on-surface": "#f0f1f1", "error": "#ba1a1a",
                        "primary": "#205661", "surface-variant": "#e2e2e3", "on-secondary-container": "#516b4e",
                        "on-secondary-fixed": "#08200a", "surface-container": "#edeeee", "secondary-fixed": "#cdebc6",
                        "on-error-container": "#93000a", "surface-bright": "#f9f9fa", "on-primary-fixed": "#001f26",
                        "tertiary-fixed": "#ffdcc6", "outline": "#70787b", "inverse-surface": "#2e3132",
                        "tertiary-fixed-dim": "#f6ba91", "on-tertiary-fixed": "#301400", "primary-container": "#3b6e7a",
                        "on-primary-container": "#bbeffc", "surface-container-low": "#f3f4f4", "outline-variant": "#c0c8ca"
                    },
                    "borderRadius": {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    "spacing": {"gutter": "24px", "margin-desktop": "64px", "md": "16px", "xs": "4px", "sm": "8px", "lg": "24px", "xl": "32px", "margin-mobile": "16px"},
                    "fontFamily": {"body-lg": ["Inter"], "display-lg": ["Literata"], "mono-sm": ["JetBrains Mono"], "headline-lg": ["Literata"], "label-md": ["Inter"], "body-md": ["Inter"], "display-md": ["Literata"]},
                    "fontSize": {
                        "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "mono-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-md": ["36px", {"lineHeight": "1.2", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; vertical-align: middle; }
        body { background-color: #F7F3EC; color: #191c1d; }
    </style>
</head>
<body class="font-body-md text-body-md overflow-hidden h-screen flex flex-col">
<!-- TopNavBar -->
<header class="flex justify-between items-center px-margin-desktop w-full h-16 bg-surface dark:bg-background border-b border-outline-variant fixed top-0 z-50">
<div class="flex items-center gap-xl">
<span class="font-display-md text-display-md text-primary tracking-tight">Pebble</span>
<div class="h-6 w-px bg-outline-variant"></div>
<span id="workspace-project-name" class="font-headline-lg text-headline-lg text-on-surface">Untitled Project</span>
</div>
<nav class="hidden md:flex items-center gap-lg">
<button class="font-body-md text-body-md text-primary font-bold border-b-2 border-primary h-16 px-sm flex items-center">Desktop</button>
<button class="font-body-md text-body-md text-on-surface-variant font-medium hover:bg-surface-container-high h-16 px-sm flex items-center">Tablet</button>
<button class="font-body-md text-body-md text-on-surface-variant font-medium hover:bg-surface-container-high h-16 px-sm flex items-center">Mobile</button>
</nav>
<div class="flex items-center gap-md">
<button class="font-label-md text-label-md px-md py-sm bg-surface-container-high rounded-lg hover:bg-surface-dim transition-all">Comfort View</button>
<button class="material-symbols-outlined text-on-surface-variant">help</button>
<button class="bg-primary text-on-primary px-lg py-sm rounded-lg font-bold hover:opacity-90 active:scale-95 transition-all">Save</button>
</div>
</header>
<div class="flex flex-1 mt-16 overflow-hidden">
<!-- Left SideNavBar (Build Plan) -->
<aside class="flex flex-col gap-md p-md w-[240px] bg-surface-container border-r border-outline-variant h-full">
<div class="mb-lg px-xs">
<h2 class="font-headline-lg text-headline-lg text-primary leading-tight">Your Build Plan</h2>
<p class="font-label-md text-label-md text-on-surface-variant opacity-70">AI-Guided Strategy</p>
</div>
<nav class="flex flex-col gap-xs flex-1">
<button data-step="idea" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">lightbulb</span> Idea
</button>
<button data-step="plan" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">map</span> Plan
</button>
<button data-step="draft" class="build-step active flex items-center gap-sm p-sm bg-primary-container text-on-primary-container rounded-lg font-bold font-label-md text-label-md active:scale-98">
<span class="material-symbols-outlined">edit_note</span> Draft
</button>
<button data-step="design" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">palette</span> Design
</button>
<button data-step="features" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">extension</span> Features
</button>
<button data-step="setup" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">settings</span> Setup
</button>
<button data-step="publish" class="build-step flex items-center gap-sm p-sm text-on-surface-variant font-label-md text-label-md hover:bg-surface-bright transition-all rounded-lg active:scale-98">
<span class="material-symbols-outlined">publish</span> Publish
</button>
</nav>
</aside>
<!-- Center Workspace (Site Preview) -->
<main class="flex-1 bg-background p-lg relative overflow-hidden flex flex-col">
<div class="flex-1 rounded-xl border border-outline-variant bg-surface-container-lowest shadow-sm overflow-hidden flex flex-col relative">
<!-- Preview Header/Browser UI -->
<div class="h-10 bg-surface-container flex items-center px-md gap-sm border-b border-outline-variant">
<div class="flex gap-xs">
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant opacity-60"></div>
<div class="w-3 h-3 rounded-full bg-outline-variant opacity-30"></div>
</div>
<div id="preview-url" class="bg-surface-bright border border-outline-variant px-lg py-xs rounded-full text-[12px] text-on-surface-variant mx-auto w-1/2 text-center truncate">
                        your-site.pebble.ai
                    </div>
</div>
<!-- Preview Canvas (live iframe to /preview/<slug>/) -->
<iframe id="site-preview" class="flex-1 bg-white w-full" src="about:blank"></iframe>
</div>
<!-- BottomNavBar (Refinement Chips) -->
<div class="fixed bottom-0 left-[240px] right-[320px] z-50 flex justify-center pb-lg pointer-events-none">
<nav class="bg-surface-container-highest border border-outline-variant shadow-sm rounded-full mx-auto w-fit px-xl py-sm flex gap-sm pointer-events-auto">
<button class="refine-chip text-on-surface-variant px-lg py-xs font-label-md text-label-md flex items-center gap-xs hover:bg-surface-bright rounded-full transition-all hover:-translate-y-1" data-refine="friendlier">
<span class="material-symbols-outlined">sentiment_satisfied</span> Make it friendlier
</button>
<button class="refine-chip text-on-surface-variant px-lg py-xs font-label-md text-label-md flex items-center gap-xs hover:bg-surface-bright rounded-full transition-all hover:-translate-y-1" data-refine="professional">
<span class="material-symbols-outlined">workspace_premium</span> More professional
</button>
<button class="refine-chip text-on-surface-variant px-lg py-xs font-label-md text-label-md flex items-center gap-xs hover:bg-surface-bright rounded-full transition-all hover:-translate-y-1" data-refine="simpler">
<span class="material-symbols-outlined">auto_awesome</span> Simpler
</button>
<button class="refine-chip text-on-surface-variant px-lg py-xs font-label-md text-label-md flex items-center gap-xs hover:bg-surface-bright rounded-full transition-all hover:-translate-y-1" data-refine="colors">
<span class="material-symbols-outlined">palette</span> Change colors
</button>
<button class="refine-chip text-on-surface-variant px-lg py-xs font-label-md text-label-md flex items-center gap-xs hover:bg-surface-bright rounded-full transition-all hover:-translate-y-1" data-refine="booking">
<span class="material-symbols-outlined">calendar_month</span> Add booking
</button>
</nav>
</div>
</main>
<!-- Right SideNavBar (Launch Setup) -->
<aside class="flex flex-col gap-md p-md w-[320px] bg-surface-container border-l border-outline-variant h-full">
<div class="mb-lg px-xs">
<h2 class="font-headline-lg text-headline-lg text-primary">Launch Setup</h2>
<p id="setup-remaining" class="font-label-md text-label-md text-on-surface-variant opacity-70">14 items</p>
</div>
<div id="launch-setup-list" class="space-y-sm flex-1 overflow-y-auto pr-xs">
<p class="text-on-surface-variant text-sm">Loading…</p>
</div>
<!-- Go Live -->
<div class="pt-md mt-auto border-t border-outline-variant">
<button id="go-live" class="w-full bg-secondary text-on-secondary py-md rounded-xl font-bold flex items-center justify-center gap-sm hover:opacity-90 transition-all active:scale-98">
<span class="material-symbols-outlined">rocket_launch</span> Go Live
</button>
</div>
</aside>
</div>
<script src="/v2/app.js"></script>
</body></html>
