<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pebble — Guided Intake</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&amp;family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#344d32",
                        "on-tertiary-fixed-variant": "#663d1e",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#b7ebf9",
                        "surface-container-highest": "#e2e2e3",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b1ceac",
                        "surface-tint": "#326571",
                        "inverse-primary": "#9bcfdc",
                        "tertiary-container": "#8b5c3a",
                        "tertiary": "#6f4525",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1d",
                        "secondary-container": "#cdebc6",
                        "surface": "#f9f9fa",
                        "surface-dim": "#d9dadb",
                        "secondary": "#4b6548",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#154d59",
                        "on-surface": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "on-surface-variant": "#40484a",
                        "background": "#f9f9fa",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#ffe0cd",
                        "primary-fixed-dim": "#9bcfdc",
                        "inverse-on-surface": "#f0f1f1",
                        "error": "#ba1a1a",
                        "primary": "#205661",
                        "surface-variant": "#e2e2e3",
                        "on-secondary-container": "#516b4e",
                        "on-secondary-fixed": "#08200a",
                        "surface-container": "#edeeee",
                        "secondary-fixed": "#cdebc6",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9fa",
                        "on-primary-fixed": "#001f26",
                        "tertiary-fixed": "#ffdcc6",
                        "outline": "#70787b",
                        "inverse-surface": "#2e3132",
                        "tertiary-fixed-dim": "#f6ba91",
                        "on-tertiary-fixed": "#301400",
                        "primary-container": "#3b6e7a",
                        "on-primary-container": "#bbeffc",
                        "surface-container-low": "#f3f4f4",
                        "outline-variant": "#c0c8ca"
                    },
                    "borderRadius": {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                    "spacing": {"gutter": "24px", "margin-desktop": "64px", "md": "16px", "xs": "4px", "sm": "8px", "lg": "24px", "xl": "32px", "margin-mobile": "16px"},
                    "fontFamily": {
                        "body-lg": ["Inter"], "display-lg": ["Literata"], "mono-sm": ["JetBrains Mono"],
                        "headline-lg": ["Literata"], "label-md": ["Inter"], "body-md": ["Inter"], "display-md": ["Literata"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "mono-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-md": ["36px", {"lineHeight": "1.2", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body { background-color: #f9f9fa; color: #191c1d; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .chip-glow { box-shadow: 0 0 15px rgba(205, 235, 198, 0.6); }
        .ai-log-scroll::-webkit-scrollbar { width: 4px; }
        .ai-log-scroll::-webkit-scrollbar-thumb { background: #D8D1C5; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md selection:bg-secondary-container">
<!-- Top Utility Bar (Back & Skip) -->
<header class="w-full h-16 flex items-center justify-between px-margin-mobile md:px-margin-desktop bg-transparent">
<button id="intake-back" class="flex items-center gap-xs text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined">chevron_left</span>
<span class="font-label-md text-label-md">Back</span>
</button>
<!-- Progress Indicators -->
<div class="flex gap-sm" id="intake-progress">
<div class="w-2 h-2 rounded-full bg-primary ring-4 ring-primary-fixed/30" data-step="1"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant" data-step="2"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant" data-step="3"></div>
</div>
<button id="intake-skip" class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">
            Skip for now
        </button>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<div class="max-w-3xl w-full text-center space-y-xl">
<div class="space-y-md">
<h1 id="intake-question" class="font-display-lg text-display-lg text-on-surface tracking-tight">
                    Who walks in your door?
                </h1>
<p id="intake-subhead" class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">
                    Don't overthink it — locals, tourists, professionals, whoever you serve.
                </p>
</div>
<!-- Multi-select Chip Grid -->
<div id="intake-chips" class="grid grid-cols-2 md:grid-cols-3 gap-md pt-lg">
<!-- Chips rendered by app.js -->
</div>
</div>
</main>
<!-- AI Log Feed (Organic Modernism Element) -->
<aside class="fixed bottom-margin-desktop left-margin-desktop hidden lg:block w-72">
<div class="bg-surface-container border border-outline-variant p-md rounded-lg space-y-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-sm">auto_awesome</span>
<span class="font-mono-sm text-mono-sm uppercase tracking-wider text-on-surface-variant">AI Logic Feed</span>
</div>
<div id="ai-log" class="font-mono-sm text-mono-sm text-on-surface-variant space-y-xs h-24 overflow-y-auto ai-log-scroll">
<p class="opacity-60">&gt; Analyzing your idea...</p>
</div>
</div>
</aside>
<!-- Footer Controls -->
<footer class="w-full p-margin-mobile md:p-margin-desktop flex justify-end items-center bg-transparent">
<button id="intake-continue" class="flex items-center justify-center gap-sm bg-primary text-on-primary px-xl py-md rounded-lg font-label-md text-label-md hover:opacity-90 active:scale-95 transition-all shadow-sm">
            Continue
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script src="/v2/app.js"></script>
</body></html>
