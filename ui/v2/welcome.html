<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pebble — Welcome</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Literata:wght@600;700&amp;family=Fraunces:opsz,wght@9..144,400;600;700&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#344d32",
                        "on-tertiary-fixed-variant": "#663d1e",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#b7ebf9",
                        "surface-container-highest": "#e2e2e3",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b1ceac",
                        "surface-tint": "#326571",
                        "inverse-primary": "#9bcfdc",
                        "tertiary-container": "#8b5c3a",
                        "tertiary": "#6f4525",
                        "on-secondary": "#ffffff",
                        "on-background": "#191c1d",
                        "secondary-container": "#cdebc6",
                        "surface": "#f9f9fa",
                        "surface-dim": "#d9dadb",
                        "secondary": "#4b6548",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#154d59",
                        "on-surface": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "on-surface-variant": "#40484a",
                        "background": "#f9f9fa",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#ffe0cd",
                        "primary-fixed-dim": "#9bcfdc",
                        "inverse-on-surface": "#f0f1f1",
                        "error": "#ba1a1a",
                        "primary": "#205661",
                        "surface-variant": "#e2e2e3",
                        "on-secondary-container": "#516b4e",
                        "on-secondary-fixed": "#08200a",
                        "surface-container": "#edeeee",
                        "secondary-fixed": "#cdebc6",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9fa",
                        "on-primary-fixed": "#001f26",
                        "tertiary-fixed": "#ffdcc6",
                        "outline": "#70787b",
                        "inverse-surface": "#2e3132",
                        "tertiary-fixed-dim": "#f6ba91",
                        "on-tertiary-fixed": "#301400",
                        "primary-container": "#3b6e7a",
                        "on-primary-container": "#bbeffc",
                        "surface-container-low": "#f3f4f4",
                        "outline-variant": "#c0c8ca",
                        "river": "#205661",
                        "sand": "#F7F3EC",
                        "stone": "#ECE6DC",
                        "mist": "#EFEAE1",
                        "pebble": "#D8D1C5",
                        "charcoal": "#40484a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "md": "16px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter", "sans-serif"],
                        "display-lg": ["Literata", "serif"],
                        "display-xl": ["Fraunces", "serif"],
                        "mono-sm": ["JetBrains Mono", "monospace"],
                        "headline-lg": ["Literata", "serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "display-md": ["Literata", "serif"]
                    },
                    "fontSize": {
                        "body-lg": ["20px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "display-xl": ["56px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "600"}],
                        "mono-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "headline-lg": ["28px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-md": ["36px", {"lineHeight": "1.2", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            background-color: #F7F3EC;
            color: #191c1d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Header / Brand Wordmark -->
<header class="flex justify-center items-center h-16 pt-xl">
<div class="flex items-center gap-sm">
<span class="font-display-md text-[32px] text-river tracking-tight font-bold">Pebble</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-xl">
<div class="max-w-[720px] w-full text-center flex flex-col items-center gap-xl">
<!-- Headline & Subhead Group -->
<div class="space-y-md">
<h1 class="font-display-xl text-display-xl text-on-surface">
                    What would you like to build today?
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[600px] mx-auto">
                    Tell me in your own words. I'll handle the technical parts.
                </p>
</div>
<!-- Input Section -->
<div class="w-full flex flex-col gap-lg items-center">
<div class="w-full relative group">
<textarea id="pebble-idea" class="w-full h-48 p-lg pr-32 bg-stone border border-pebble rounded-xl font-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-river focus:border-river transition-all resize-none shadow-sm" placeholder="Example: I run a bakery in Brooklyn and I want a website where customers can see my menu and order online."></textarea>
<!-- Voice + Upload affordances (top-right of textarea) -->
<div class="absolute top-md right-md flex items-center gap-xs">
<button id="pebble-voice" type="button" title="Dictate your idea" class="p-xs rounded-full hover:bg-mist text-on-surface-variant transition-colors flex items-center justify-center" aria-label="Voice input">
<span class="material-symbols-outlined text-[20px]">mic</span>
</button>
<label title="Upload a sketch, screenshot, or inspiration image" class="p-xs rounded-full hover:bg-mist text-on-surface-variant transition-colors flex items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-[20px]">image</span>
<input type="file" id="pebble-image" accept="image/*" multiple class="hidden">
</label>
</div>
<div class="absolute bottom-md right-md flex items-center gap-xs text-outline font-mono-sm pointer-events-none">
<span class="material-symbols-outlined text-[18px]">auto_awesome</span>
<span>AI Ready</span>
</div>
<!-- Attached image previews -->
<div id="pebble-image-preview" class="absolute bottom-md left-md flex items-center gap-xs"></div>
</div>
<!-- Starter Chips (6 — match Base44/Lovable breadth) -->
<div class="flex flex-wrap justify-center gap-sm">
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="A business website that introduces what I do and lets people reach out.">
                        Business website
                    </button>
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="An online store where customers can browse products and check out.">
                        Online store
                    </button>
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="A portfolio site that showcases my work and bio.">
                        Portfolio
                    </button>
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="A booking site where clients can schedule appointments with me.">
                        Booking site
                    </button>
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="A restaurant site with my menu, hours, and a reservation option.">
                        Restaurant menu
                    </button>
<button class="starter-chip px-md py-sm bg-stone hover:bg-mist border border-pebble rounded-full font-label-md text-charcoal transition-colors" data-prompt="A real-estate page that showcases listings and lets buyers contact me.">
                        Real estate
                    </button>
</div>
<!-- Primary CTA -->
<button id="pebble-start" class="w-full md:w-auto md:min-w-[200px] bg-river text-sand font-label-md text-lg px-xl py-md rounded-lg hover:opacity-90 active:scale-95 transition-all shadow-sm">
                    Start
                </button>
</div>
<!-- AI Log / Transparency Feed (Organic Modernism Philosophy) -->
<div class="w-full bg-stone border border-pebble p-md rounded-lg text-left overflow-hidden">
<div class="flex items-center gap-sm mb-xs">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-md text-[12px] uppercase tracking-wider text-charcoal">AI Log</span>
</div>
<div id="ai-log" class="font-mono-sm text-[13px] text-on-surface-variant leading-relaxed">
<p class="opacity-60">Waiting for your input...</p>
</div>
</div>
</div>
</main>
<!-- Footer Area -->
<footer class="py-xl px-margin-mobile md:px-margin-desktop text-center">
<p class="font-label-md text-outline max-w-[500px] mx-auto">
            You'll see exactly what I'm doing every step of the way. Nothing is final until you say it is.
        </p>
</footer>
<!-- Background Decoration (Organic/Modern Subtle Elements) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-mist rounded-full blur-[120px] opacity-50"></div>
<div class="absolute bottom-[5%] right-[0%] w-[30%] h-[30%] bg-mist rounded-full blur-[100px] opacity-40"></div>
</div>
<script src="/v2/app.js"></script>
</body></html>
